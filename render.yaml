# Render Blueprint: creates a PostgreSQL database + a Docker web service that
# deploys from GitHub (Saiful1253/Flight-Booking-System).
databases:
  - name: flight-booking-db
    plan: free
    databaseName: flight_booking

services:
  - type: web
    name: flight-booking-system
    runtime: docker
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: flight-booking-db
          property: connectionString
    healthCheckPath: "/"
