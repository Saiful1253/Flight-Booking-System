# Render Blueprint: creates a PostgreSQL database + a web service that
# auto-deploys from GitHub (Saiful1253/Flight-Booking-System).
databases:
  - name: flight-booking-db
    plan: free
    databaseName: flight_booking

services:
  - type: web
    name: flight-booking-system
    runtime: dotnet
    plan: free
    buildCommand: "dotnet publish FlightBookingSystem/FlightBookingSystem.csproj -c Release -o renderbuild"
    startCommand: "dotnet renderbuild/FlightBookingSystem.dll"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: flight-booking-db
          property: connectionString
    healthCheckPath: "/"
